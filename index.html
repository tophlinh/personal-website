<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pond Side — Personal Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; padding: 0; background: #59b2c8; overflow: hidden; }
      body { touch-action: none; font-family: 'VT323', monospace; }
      #scene { position: absolute; left: 50%; top: 50%; width: 1008px; height: 1224px; transform-origin: center; }
      #scene img.bg { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
      .label { position: absolute; z-index: 1; transform: translate(-50%, -50%); font-family: 'Press Start 2P'; font-size: 18px; color: #2b3a2f; background: #f6ecc9; border: 4px solid #1f5866; padding: 10px 14px; cursor: pointer; box-shadow: 4px 4px 0 #1f586688; animation: bob 2.4s ease-in-out infinite; white-space: nowrap; }
      .label:hover { background: #fff7dc; transform: translate(-50%, -60%) scale(1.08); }
      .label::after { content: ''; position: absolute; left: 50%; bottom: -14px; margin-left: -6px; border: 6px solid transparent; border-top-color: #1f5866; }
      @keyframes bob { 50% { margin-top: -6px; } }
      #title { position: absolute; left: 32px; top: 32px; text-align: left; font-family: 'Press Start 2P'; color: #f6ecc9; font-size: 34px; text-shadow: 4px 4px 0 #1f5866; line-height: 1.6; }
      #title small { font-size: 16px; display: block; }
      #dialog { position: absolute; z-index: 20; left: 50%; bottom: 50px; transform: translateX(-50%); width: 860px; min-height: 230px; background: #f6ecc9; border: 6px solid #1f5866; box-shadow: 0 0 0 6px #f6ecc9, 0 0 0 12px #1f5866, 8px 8px 0 12px #00000033; padding: 26px 34px; display: none; color: #2b3a2f; }
      #dialog h2 { font-family: 'Press Start 2P'; font-size: 22px; margin: 0 0 14px; color: #1f5866; }
      #dialog .text { font-size: 32px; line-height: 1.25; white-space: pre-line; }
      #dialog .close { position: absolute; right: 18px; top: 14px; font-family: 'Press Start 2P'; cursor: pointer; font-size: 18px; color: #1f5866; }
      #dialog .hint { position: absolute; right: 24px; bottom: 12px; font-size: 24px; color: #1f5866; animation: bob 1s infinite; }
      #mute { position: absolute; right: 40px; top: 40px; font-family: 'Press Start 2P'; font-size: 14px; background: #f6ecc9; border: 4px solid #1f5866; padding: 10px; cursor: pointer; }
      #artist-credit { position: absolute; right: 20px; bottom: 20px; z-index: 2; padding: 7px 9px; border: 2px solid #f6ecc9; background: #1f5866cc; color: #f6ecc9; font: 24px 'VT323', monospace; text-shadow: 1px 1px 0 #1f5866; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="scene">
        <img class="bg" src="assets/websitebackground.webp" alt="pixel-art pond with a dock, tree, and two cats fishing" />
        <div id="title">Hi, I'm Tori<small>click around the pond ~</small></div>
        <div id="mute">♪ ON</div>
        <div id="artist-credit">Pixel art by @DecomposedMaw</div>
        <div id="dialog"><span class="close">x</span><h2></h2><div class="text"></div><span class="hint">▼</span></div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
